name = "proxy"
main = "src/worker/index.ts"
compatibility_date = "2024-03-20"

# Note: The Cloudflare Worker intercepts requests at the edge.
# Do NOT put secret values here. Use `wrangler secret put` for production secrets.
[vars]
# FIREBASE_STORAGE_BUCKET = "..."

# Required Secrets to be added via Wrangler:
# FIREBASE_DB_URL
# FIREBASE_DB_SECRET
# FIREBASE_STORAGE_BUCKET
# FIREBASE_STORAGE_AUTH_TOKEN
